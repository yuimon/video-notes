    --surface-2:#282C20;
    --text:#E9E6D8;
    --text-muted:#A6A693;

}
:root[data-theme="dark"]{
  --bg:#16180F;
  --surface:#1E2117;
  --surface-2:#282C20;
  --text:#E9E6D8;
  --text-muted:#A6A693;
  --border:#3A3E2F;
  --accent:#6FC2A3;
  --accent-text:#10241B;
  --g-biyou:#E08DBE;
  --g-kintore:#E3A857;

*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  padding-inline:16px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  max-width:720px;
  margin-inline:auto;
}
.serif{font-family:"Shippori Mincho",serif;}
h1,h2,h3{text-wrap:balance;}

header.top{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  background:var(--bg);
  padding-block:14px 10px;
  z-index:10;
  border-bottom:1px solid var(--border);
}
header.top h1{
  font-size:1.3rem;
  margin:0 0 4px;
  letter-spacing:.02em;
}
header.top .sub{
  color:var(--text-muted);
  font-size:.78rem;
  margin:0 0 10px;
}
.search-row{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
#q{
  flex:1;
  padding:9px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:.92rem;
}
#q:focus{outline:2px solid var(--accent);outline-offset:1px;}
.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  font-size:.82rem;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
}
.chip[data-active="1"]{
  background:var(--accent);
  color:var(--accent-text);
  border-color:var(--accent);
  font-weight:600;
}
.count-row{
  color:var(--text-muted);
  font-size:.76rem;
  padding-block:8px 4px;
}

main{padding-bottom:40px;}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}
.card summary{
  list-style:none;
  padding:13px 14px;
  cursor:pointer;
  display:block;
}
.card summary::-webkit-details-marker{display:none;}
.row-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.genre-chip{
  display:inline-block;
  font-size:.68rem;
  padding:2px 9px;
  border-radius:999px;
  color:#fff;
  font-weight:600;
  white-space:nowrap;
  margin-bottom:6px;
}
.card h3{
  font-size:1.0rem;
  margin:0 0 4px;
  line-height:1.4;
}
.meta{
  font-size:.74rem;
  color:var(--text-muted);
  margin-bottom:6px;
}
.oneline{
  font-size:.95rem;
  padding:2px 0 0;
}
.arrow{
  flex:0 0 auto;
  color:var(--text-muted);
  font-size:.8rem;
  padding-top:2px;
  transition:transform .15s;
}
.card[open] .arrow{transform:rotate(180deg);}

.detail{
  padding:0 14px 16px;
  border-top:1px solid var(--border);
}
.detail h4{
  font-size:.78rem;
  color:var(--text-muted);
  margin:14px 0 6px;
  font-weight:700;
}
.detail ul{
  margin:0;
  padding-left:1.1em;
}
.detail li{
  font-size:.88rem;
  line-height:1.65;
  margin-bottom:6px;
}
.basis{
  font-size:.85rem;
  line-height:1.6;
  background:var(--surface-2);
  border-radius:8px;
  padding:9px 11px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}
.tag{
  font-size:.72rem;
  color:var(--text-muted);
  border:1px solid var(--border);
  padding:3px 9px;
  border-radius:999px;
}
.link{
  display:inline-block;
  margin-top:12px;
  font-size:.82rem;
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid var(--accent);
}
.empty{
  text-align:center;
  color:var(--text-muted);
  padding:50px 10px;
  font-size:.9rem;
}
.footer-note{
  text-align:center;
  color:var(--text-muted);
  font-size:.72rem;
  padding:10px 0 30px;

</style>

function genreMeta(key){ return GENRES.find(g=>g.key===key); }

const chipsEl = document.getElementById("chips");
const allChip = document.createElement("div");
allChip.className = "chip";
allChip.dataset.active = "1";
allChip.textContent = `すべて (${VIDEOS.length})`;
allChip.dataset.key = "all";
chipsEl.appendChild(allChip);

GENRES.forEach(g=>{
  const n = VIDEOS.filter(v=>v.genre===g.key).length;
  const el = document.createElement("div");
  el.className = "chip";
  el.textContent = `${g.label} (${n})`;
  el.dataset.key = g.key;
  chipsEl.appendChild(el);
});

let activeGenre = "all";
chipsEl.addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  activeGenre = chip.dataset.key;
  [...chipsEl.children].forEach(c=>c.dataset.active = (c===chip)?"1":"0");
  render();
});

const qInput = document.getElementById("q");
qInput.addEventListener("input", render);

function matchesQuery(v, q){
  if(!q) return true;
  const hay = [v.title, v.channel, v.one, ...v.tags].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render(){
  const q = qInput.value.trim();
  const list = VIDEOS.filter(v=>{
    const genreOk = (activeGenre === "all") || (v.genre === activeGenre);
    return genreOk && matchesQuery(v, q);
  });

  document.getElementById("countRow").textContent = `${list.length}本 表示中（全${VIDEOS.length}本）`;

  const main = document.getElementById("main");
  const emptyEl = document.getElementById("empty");
  main.innerHTML = "";

  if(list.length === 0){
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  list.forEach(v=>{
    const gm = genreMeta(v.genre);
    const card = document.createElement("details");
    card.className = "card";

    const summary = document.createElement("summary");
    summary.innerHTML = `
      <div class="row-top">
        <div style="flex:1;min-width:0;">
          <span class="genre-chip" style="background:var(${gm.varname})">${gm.label}</span>
          <h3>${escapeHtml(v.title)}</h3>
          <div class="meta">${escapeHtml(v.channel)} ・ ${escapeHtml(v.duration)} ・ ${escapeHtml(v.date)}</div>
          <div class="oneline serif">${escapeHtml(v.one)}</div>
        </div>
        <div class="arrow">▾</div>
      </div>
    `;
    card.appendChild(summary);

    const detail = document.createElement("div");
    detail.className = "detail";

    const h4pts = document.createElement("h4");
    h4pts.textContent = "要点";
    detail.appendChild(h4pts);
    const ul = document.createElement("ul");
    v.points.forEach(p=>{
      const li = document.createElement("li");
      li.textContent = p;
      ul.appendChild(li);
    });
    detail.appendChild(ul);

    const h4basis = document.createElement("h4");
    h4basis.textContent = "動画の主張の根拠";
    detail.appendChild(h4basis);
    const basisDiv = document.createElement("div");
    basisDiv.className = "basis";
    basisDiv.textContent = v.basis;
    detail.appendChild(basisDiv);

    const tagsDiv = document.createElement("div");
    tagsDiv.className = "tags";
    v.tags.forEach(t=>{
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = t;
      tagsDiv.appendChild(span);
    });
    detail.appendChild(tagsDiv);

    const a = document.createElement("a");
    a.className = "link";
    a.href = v.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "YouTubeで見る ↗";
    detail.appendChild(a);

    card.appendChild(detail);
    main.appendChild(card);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

render();
</script>
